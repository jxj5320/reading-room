<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Reading Room</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --ink: #2b2620;
    --paper: #faf7f1;
    --line: #e4ddd0;
    --accent: #7a8c6f;
    --accent-soft: #e7ede2;
    --dim: #9a9184;
    --err: #b1543f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 60px;
  }

  .room {
    width: 100%;
    max-width: 640px;
    position: relative;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 28px;
  }

  header .left {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  header h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }

  header span.status {
    font-size: 12px;
    color: var(--dim);
  }

  .gear-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
  }

  .gear-btn:hover { background: var(--accent-soft); }

  .settings-panel {
    display: none;
    position: absolute;
    top: 54px;
    right: 0;
    z-index: 40;
    width: 300px;
    max-width: calc(100vw - 32px);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
    padding: 18px;
  }

  .settings-panel.open { display: block; }

  .settings-panel h2 {
    font-size: 14px;
    margin: 0 0 12px;
  }

  .field { margin-bottom: 12px; }

  .field label {
    display: block;
    font-size: 11px;
    color: var(--dim);
    margin-bottom: 4px;
  }

  .field input[type="text"],
  .field input[type="password"],
  .field select {
    width: 100%;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
  }

  .settings-note {
    font-size: 11px;
    color: var(--dim);
    line-height: 1.6;
    margin-top: 4px;
  }

  .settings-close {
    width: 100%;
    margin-top: 6px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 8px;
    border-radius: 4px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
  }

  textarea {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    line-height: 1.6;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }

  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .attach-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .thumb {
    height: 44px;
    border-radius: 4px;
    border: 1px solid var(--line);
    object-fit: cover;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  button {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: 4px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
  }

  button.secondary {
    background: transparent;
    color: var(--ink);
  }

  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  select {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
  }

  .rate-label {
    font-size: 12px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-line {
    margin-top: 10px;
    font-size: 12px;
    min-height: 16px;
  }
  .status-line.err { color: var(--err); }
  .status-line.ok { color: var(--accent); }

  footer {
    margin-top: 22px;
    font-size: 12px;
    color: var(--dim);
    line-height: 1.6;
  }

  /* ---- reading overlay (full screen "read aloud" mode) ---- */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 100;
    overflow-y: auto;
  }
  .overlay.open { display: block; }

  .overlay-inner {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 20px 60px;
  }

  .overlay-top {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }

  .close-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    font-size: 18px;
    cursor: pointer;
  }

  .overlay-image {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--line);
    margin-bottom: 22px;
    display: block;
    filter: brightness(1.12) saturate(1.05);
    opacity: 1;
    background: #fff;
    -webkit-filter: brightness(1.12) saturate(1.05);
  }

  .overlay-stage {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 28px 24px;
    min-height: 140px;
  }

  .overlay-phrase {
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    line-height: 1.75;
    white-space: pre-wrap;
  }

  .word.en { color: var(--ink); font-weight: 600; }
  .word.ko { color: var(--dim); font-weight: 400; }
  .word.active { background: var(--accent-soft); }

  .word {
    transition: background-color 0.15s ease;
    border-radius: 3px;
    padding: 0 1px;
  }

  .overlay-controls {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
<div class="room">
  <header>
    <div class="left">
      <h1>English Reading Room</h1>
      <span class="status" id="status">idle</span>
      <span class="status" id="playCountEl">재생 0회</span>
    </div>
    <button class="gear-btn" id="gearBtn" title="Polly 설정">⚙</button>
  </header>

  <div class="settings-panel" id="settingsPanel">
    <div id="lockView">
      <h2>🔒 설정 잠금</h2>
      <div class="field">
        <label>암호 4자리</label>
        <input type="password" id="lockPassword" inputmode="numeric" maxlength="4" placeholder="••••">
      </div>
      <div class="settings-note" id="lockError" style="color: var(--err); display:none;">암호가 틀렸어요.</div>
      <button class="settings-close" id="unlockBtn">확인</button>
    </div>
    <div id="settingsView" style="display:none;">
      <h2>Amazon Polly 설정</h2>
      <div class="field">
        <label>AWS Access Key ID</label>
        <input type="text" id="pollyAccessKey" autocomplete="off" placeholder="AKIA...">
      </div>
      <div class="field">
        <label>AWS Secret Access Key</label>
        <input type="password" id="pollySecretKey" autocomplete="off" placeholder="••••••••">
      </div>
      <div class="field">
        <label>리전</label>
        <select id="pollyRegion">
          <option value="us-east-1">us-east-1 (N. Virginia)</option>
          <option value="us-west-2">us-west-2 (Oregon)</option>
          <option value="ap-northeast-2">ap-northeast-2 (Seoul)</option>
          <option value="ap-northeast-1">ap-northeast-1 (Tokyo)</option>
          <option value="eu-west-1">eu-west-1 (Ireland)</option>
        </select>
      </div>
      <div class="field">
        <label>엔진</label>
        <select id="pollyEngine">
          <option value="neural" selected>neural (자연스러움, 리전 제한 있음)</option>
          <option value="standard">standard (모든 리전 가능)</option>
        </select>
      </div>
      <div class="field">
        <label>목소리</label>
        <select id="pollyVoice">
          <option value="Joanna">Joanna (미국 여)</option>
          <option value="Matthew">Matthew (미국 남)</option>
          <option value="Ivy">Ivy (미국 여, 아동톤)</option>
          <option value="Kendra">Kendra (미국 여)</option>
          <option value="Justin">Justin (미국 남, 아동톤)</option>
          <option value="Amy">Amy (영국 여)</option>
          <option value="Brian">Brian (영국 남)</option>
          <option value="Emma">Emma (영국 여)</option>
        </select>
      </div>
      <div class="settings-note">
        키는 저장되지 않고 새로고침하면 사라져요(보안). 나머지 설정과 입력한 텍스트, 사진은 이 브라우저에 저장돼서 다시 들어와도 남아있어요.
      </div>
      <button class="settings-close" id="settingsCloseBtn">닫기</button>
    </div>
  </div>

  <textarea id="input" placeholder="영어와 한글 번역이 섞여 있어도 괜찮아요. 영어만 읽어드려요.">Through examples of democracy in local communities, we'll learn about the importance of local self-governance and resident participation.</textarea>

  <div class="attach-row">
    <button class="secondary" id="attachBtn" type="button">사진 첨부</button>
    <input type="file" id="imageInput" accept="image/*" style="display:none;">
    <img id="thumb" class="thumb" style="display:none;">
    <button class="secondary" id="removeImageBtn" type="button" style="display:none;">사진 삭제</button>
  </div>

  <div class="controls">
    <button id="playBtn">Read aloud</button>
    <button id="stopBtnMain" class="secondary" disabled>Stop</button>
    <button id="downloadBtnMain" class="secondary" disabled>mp3 다운로드</button>
    <button id="resetBtn" class="secondary" type="button">초기화</button>
    <label class="rate-label">
      Speed
      <select id="rateSelect">
        <option value="0.7">0.7x</option>
        <option value="0.85">0.85x</option>
        <option value="1" selected>1x</option>
        <option value="1.15">1.15x</option>
        <option value="1.3">1.3x</option>
      </select>
    </label>
  </div>

  <div class="status-line" id="pollyStatus"></div>

  <footer>
    이 브라우저에서 직접 Amazon Polly API를 SigV4로 서명해 호출해서 실제 mp3 오디오와 단어별 타이밍(Speech Marks)을
    받아와요. 영문 알파벳이 없는 토큰(한글, 숫자 목록, →, / 등)은 자동으로 읽지 않아요.
  </footer>
</div>

<!-- Reading overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <div class="overlay-top">
      <button class="close-btn" id="closeOverlayBtn">✕</button>
    </div>
    <img id="overlayImage" class="overlay-image" style="display:none;">
    <div class="overlay-stage">
      <div class="overlay-phrase" id="overlayPhrase"></div>
    </div>
    <div class="status-line" id="overlayStatus"></div>
    <div class="overlay-controls">
      <button id="playOverlayBtn" disabled>Play</button>
      <button id="stopBtn" class="secondary" disabled>Stop</button>
      <button id="downloadBtn" class="secondary" disabled>mp3 다운로드</button>
    </div>
  </div>
</div>
<audio id="audioPlayer" style="display:none;"></audio>

<script>
const STORAGE_KEY = 'erroom_v1';

const input = document.getElementById('input');
const playBtn = document.getElementById('playBtn');
const stopBtn = document.getElementById('stopBtn');
const downloadBtn = document.getElementById('downloadBtn');
const stopBtnMain = document.getElementById('stopBtnMain');
const downloadBtnMain = document.getElementById('downloadBtnMain');
const resetBtn = document.getElementById('resetBtn');
const rateSelect = document.getElementById('rateSelect');
const statusEl = document.getElementById('status');
const pollyStatus = document.getElementById('pollyStatus');
const overlayStatus = document.getElementById('overlayStatus');
const audioPlayer = document.getElementById('audioPlayer');
const gearBtn = document.getElementById('gearBtn');
const settingsPanel = document.getElementById('settingsPanel');
const settingsCloseBtn = document.getElementById('settingsCloseBtn');
const attachBtn = document.getElementById('attachBtn');
const imageInput = document.getElementById('imageInput');
const thumb = document.getElementById('thumb');
const removeImageBtn = document.getElementById('removeImageBtn');
const overlay = document.getElementById('overlay');
const overlayImage = document.getElementById('overlayImage');
const overlayPhrase = document.getElementById('overlayPhrase');
const closeOverlayBtn = document.getElementById('closeOverlayBtn');
const pollyRegion = document.getElementById('pollyRegion');
const pollyEngine = document.getElementById('pollyEngine');
const pollyVoice = document.getElementById('pollyVoice');
const playOverlayBtn = document.getElementById('playOverlayBtn');
const playCountEl = document.getElementById('playCountEl');

let wordSpans = [];
let spokenSpans = [];
let spokenIndexToGroup = [];
let groups = [];
let attachedImageData = null;
let pollyMarks = [];
let pollyAudioUrl = null;
let rafId = null;
let playCount = 0;
let audioReady = false;

function updatePlayCountDisplay() {
  playCountEl.textContent = `재생 ${playCount}회`;
}

/* ---------- persistence (text, image, settings — never the AWS keys) ---------- */
function saveState() {
  try {
    const state = {
      text: input.value,
      image: attachedImageData,
      region: pollyRegion.value,
      engine: pollyEngine.value,
      voice: pollyVoice.value,
      rate: rateSelect.value,
      playCount: playCount
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { /* storage full or unavailable — ignore */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const state = JSON.parse(raw);
    if (state.text) input.value = state.text;
    if (state.image) { attachedImageData = state.image; showThumb(state.image); }
    if (state.region) pollyRegion.value = state.region;
    if (state.engine) pollyEngine.value = state.engine;
    if (state.voice) pollyVoice.value = state.voice;
    if (state.rate) rateSelect.value = state.rate;
    if (typeof state.playCount === 'number') playCount = state.playCount;
  } catch (e) { /* ignore corrupt data */ }
}
loadState();
updatePlayCountDisplay();

input.addEventListener('input', saveState);
[pollyRegion, pollyEngine, pollyVoice, rateSelect].forEach(el => el.addEventListener('change', saveState));

/* ---------- image attach ---------- */
function showThumb(dataUrl) {
  thumb.src = dataUrl;
  thumb.style.display = '';
  removeImageBtn.style.display = '';
}
attachBtn.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    attachedImageData = reader.result;
    showThumb(attachedImageData);
    saveState();
  };
  reader.readAsDataURL(file);
});
removeImageBtn.addEventListener('click', () => {
  attachedImageData = null;
  thumb.style.display = 'none';
  removeImageBtn.style.display = 'none';
  imageInput.value = '';
  saveState();
});

/* ---------- settings panel toggle + child lock (client-side only) ---------- */
const LOCK_CODE = '0404';
const lockView = document.getElementById('lockView');
const settingsView = document.getElementById('settingsView');
const lockPassword = document.getElementById('lockPassword');
const lockError = document.getElementById('lockError');
const unlockBtn = document.getElementById('unlockBtn');

function showLockView() {
  lockView.style.display = '';
  settingsView.style.display = 'none';
  lockPassword.value = '';
  lockError.style.display = 'none';
}

function tryUnlock() {
  if (lockPassword.value === LOCK_CODE) {
    lockView.style.display = 'none';
    settingsView.style.display = '';
  } else {
    lockError.style.display = '';
    lockPassword.value = '';
    lockPassword.focus();
  }
}
unlockBtn.addEventListener('click', tryUnlock);
lockPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

gearBtn.addEventListener('click', () => {
  const opening = !settingsPanel.classList.contains('open');
  settingsPanel.classList.toggle('open');
  if (opening) showLockView();
});
settingsCloseBtn.addEventListener('click', () => { settingsPanel.classList.remove('open'); showLockView(); });
document.addEventListener('click', (e) => {
  if (!settingsPanel.contains(e.target) && e.target !== gearBtn && settingsPanel.classList.contains('open')) {
    settingsPanel.classList.remove('open');
    showLockView();
  }
});

/* ---------- word rendering: only tokens with a Latin letter are "spoken" ---------- */
function hasLatinLetter(tok) {
  return /[A-Za-z]/.test(tok);
}

function buildPhrase(text) {
  overlayPhrase.innerHTML = '';
  wordSpans = [];
  spokenSpans = [];
  groups = [];
  spokenIndexToGroup = [];
  let currentGroup = null;
  let breakPending = true;

  const tokens = text.split(/(\s+)/);
  tokens.forEach(tok => {
    if (tok.trim() === '') {
      overlayPhrase.appendChild(document.createTextNode(tok));
      return;
    }
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = tok;
    overlayPhrase.appendChild(span);
    wordSpans.push(span);

    if (hasLatinLetter(tok)) {
      span.classList.add('en');
      if (breakPending || currentGroup === null) {
        currentGroup = [];
        groups.push(currentGroup);
        breakPending = false;
      }
      currentGroup.push(span);
      spokenSpans.push(span);
      spokenIndexToGroup.push(groups.length - 1);
    } else {
      span.classList.add('ko');
      breakPending = true;
    }
  });
}

function clearHighlight() {
  wordSpans.forEach(s => s.classList.remove('active'));
}

function highlightSpokenIndex(idx) {
  const activeGroup = spokenIndexToGroup[idx];
  groups.forEach((grp, gi) => {
    grp.forEach(span => {
      if (gi === activeGroup) span.classList.add('active');
      else span.classList.remove('active');
    });
  });
}

function setReading(isReading) {
  playBtn.disabled = isReading;
  stopBtn.disabled = !isReading;
  stopBtnMain.disabled = !isReading;
  playOverlayBtn.disabled = isReading || !audioReady;
  statusEl.textContent = isReading ? 'reading…' : 'idle';
}

function setDownloadEnabled(enabled) {
  downloadBtn.disabled = !enabled;
  downloadBtnMain.disabled = !enabled;
}

function setStatus(msg, kind) {
  const cls = 'status-line' + (kind ? ' ' + kind : '');
  pollyStatus.textContent = msg; pollyStatus.className = cls;
  overlayStatus.textContent = msg; overlayStatus.className = cls;
}

/* ---------- AWS SigV4 helpers (Web Crypto) ---------- */
function toHex(buf) {
  return Array.prototype.map.call(new Uint8Array(buf), b => ('00' + b.toString(16)).slice(-2)).join('');
}
async function sha256Hex(str) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return toHex(digest);
}
async function hmacRaw(keyBytes, msg) {
  const cryptoKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return crypto.subtle.sign('HMAC', cryptoKey, new TextEncoder().encode(msg));
}
async function getSigningKey(secretKey, dateStamp, region, service) {
  const kDate = await hmacRaw(new TextEncoder().encode('AWS4' + secretKey), dateStamp);
  const kRegion = await hmacRaw(kDate, region);
  const kService = await hmacRaw(kRegion, service);
  return hmacRaw(kService, 'aws4_request');
}
function amzDateNow() {
  return new Date().toISOString().replace(/[:-]|\.\d{3}/g, '');
}

async function pollySignedFetch({ accessKey, secretKey, region, bodyObj }) {
  const service = 'polly';
  const host = `polly.${region}.amazonaws.com`;
  const path = '/v1/speech';
  const amzDate = amzDateNow();
  const dateStamp = amzDate.slice(0, 8);
  const bodyStr = JSON.stringify(bodyObj);
  const payloadHash = await sha256Hex(bodyStr);
  const canonicalHeaders = `content-type:application/json\nhost:${host}\nx-amz-date:${amzDate}\n`;
  const signedHeaders = 'content-type;host;x-amz-date';
  const canonicalRequest = `POST\n${path}\n\n${canonicalHeaders}\n${signedHeaders}\n${payloadHash}`;
  const credentialScope = `${dateStamp}/${region}/${service}/aws4_request`;
  const stringToSign = `AWS4-HMAC-SHA256\n${amzDate}\n${credentialScope}\n${await sha256Hex(canonicalRequest)}`;
  const signingKey = await getSigningKey(secretKey, dateStamp, region, service);
  const signature = toHex(await hmacRaw(signingKey, stringToSign));
  const authorization = `AWS4-HMAC-SHA256 Credential=${accessKey}/${credentialScope}, SignedHeaders=${signedHeaders}, Signature=${signature}`;

  const res = await fetch(`https://${host}${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Amz-Date': amzDate, 'Authorization': authorization },
    body: bodyStr
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Polly ${res.status}: ${errText.slice(0, 300)}`);
  }
  return res;
}

function escapeSsml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---------- overlay open/close ---------- */
function openOverlay() {
  if (attachedImageData) { overlayImage.src = attachedImageData; overlayImage.style.display = ''; }
  else { overlayImage.style.display = 'none'; }
  overlay.classList.add('open');
}
function closeOverlay() {
  overlay.classList.remove('open');
  audioPlayer.pause();
  if (rafId) cancelAnimationFrame(rafId);
  setReading(false);
}
closeOverlayBtn.addEventListener('click', closeOverlay);

/* ---------- Polly playback ---------- */
async function playPolly() {
  const rawText = input.value.trim();
  if (!rawText) return;

  const accessKey = document.getElementById('pollyAccessKey').value.trim();
  const secretKey = document.getElementById('pollySecretKey').value.trim();
  const region = pollyRegion.value;
  const engine = pollyEngine.value;
  const voiceId = pollyVoice.value;
  const rate = Number(rateSelect.value);
  const ratePercent = Math.round(rate * 100);

  if (!accessKey || !secretKey) {
    setStatus('설정(⚙)에서 Access Key와 Secret Key를 입력해주세요.', 'err');
    settingsPanel.classList.add('open');
    showLockView();
    return;
  }

  buildPhrase(rawText);
  openOverlay();
  setStatus('Polly에 요청 중…', '');
  playBtn.disabled = true;
  audioReady = false;
  playOverlayBtn.disabled = true;
  setDownloadEnabled(false);

  const speakText = spokenSpans.map(s => s.textContent).join(' ');
  if (!speakText.trim()) {
    setStatus('읽을 수 있는 영어 텍스트가 없어요.', 'err');
    playBtn.disabled = false;
    return;
  }

  const ssml = `<speak><prosody rate="${ratePercent}%">${escapeSsml(speakText)}</prosody></speak>`;
  const baseBody = { Text: ssml, VoiceId: voiceId, Engine: engine, TextType: 'ssml' };

  try {
    const marksRes = await pollySignedFetch({
      accessKey, secretKey, region,
      bodyObj: { ...baseBody, OutputFormat: 'json', SpeechMarkTypes: ['word'] }
    });
    const marksText = await marksRes.text();
    pollyMarks = marksText.trim().split('\n').filter(Boolean).map(line => JSON.parse(line));

    const audioRes = await pollySignedFetch({
      accessKey, secretKey, region,
      bodyObj: { ...baseBody, OutputFormat: 'mp3' }
    });
    const audioBuf = await audioRes.arrayBuffer();
    const blob = new Blob([audioBuf], { type: 'audio/mpeg' });
    if (pollyAudioUrl) URL.revokeObjectURL(pollyAudioUrl);
    pollyAudioUrl = URL.createObjectURL(blob);
    audioPlayer.src = pollyAudioUrl;

    setDownloadEnabled(true);
    audioReady = true;
    playOverlayBtn.disabled = false;
    setStatus('준비 완료. Play를 눌러 재생하세요.', 'ok');

    audioPlayer.onended = () => {
      setReading(false);
      clearHighlight();
      if (rafId) cancelAnimationFrame(rafId);
      playCount += 1;
      updatePlayCountDisplay();
      saveState();
    };
  } catch (err) {
    setStatus(err.message || String(err), 'err');
    setReading(false);
  } finally {
    playBtn.disabled = false;
  }
}

function startPlayback() {
  if (!audioReady) return;
  clearHighlight();
  audioPlayer.currentTime = 0;
  setReading(true);
  audioPlayer.play();

  const step = () => {
    const ms = audioPlayer.currentTime * 1000;
    let idx = -1;
    for (let i = 0; i < pollyMarks.length; i++) {
      if (pollyMarks[i].time <= ms) idx = i; else break;
    }
    if (idx >= 0) highlightSpokenIndex(idx);
    if (!audioPlayer.paused && !audioPlayer.ended) rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}

playBtn.addEventListener('click', playPolly);
playOverlayBtn.addEventListener('click', startPlayback);

function stopReading() {
  audioPlayer.pause();
  audioPlayer.currentTime = 0;
  if (rafId) cancelAnimationFrame(rafId);
  setReading(false);
  clearHighlight();
}
stopBtn.addEventListener('click', stopReading);
stopBtnMain.addEventListener('click', stopReading);

function downloadMp3() {
  if (!pollyAudioUrl) return;
  const a = document.createElement('a');
  a.href = pollyAudioUrl;
  const firstWords = spokenSpans.slice(0, 4).map(s => s.textContent).join('_').replace(/[^\w-]/g, '');
  a.download = `${firstWords || 'reading'}.mp3`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
downloadBtn.addEventListener('click', downloadMp3);
downloadBtnMain.addEventListener('click', downloadMp3);

resetBtn.addEventListener('click', () => {
  stopReading();
  input.value = '';
  attachedImageData = null;
  thumb.style.display = 'none';
  removeImageBtn.style.display = 'none';
  imageInput.value = '';
  overlayPhrase.innerHTML = '';
  wordSpans = [];
  spokenSpans = [];
  pollyMarks = [];
  if (pollyAudioUrl) { URL.revokeObjectURL(pollyAudioUrl); pollyAudioUrl = null; }
  audioPlayer.removeAttribute('src');
  setDownloadEnabled(false);
  audioReady = false;
  playOverlayBtn.disabled = true;
  playCount = 0;
  updatePlayCountDisplay();
  setStatus('', '');
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
});
</script>
</body>
</html>
